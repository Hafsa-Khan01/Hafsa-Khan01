<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92">
<defs>
 <linearGradient id="nebula" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".38" stop-color="#7652c8"/><stop offset=".68" stop-color="#c026d3"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".18" stop-color="#22d3ee"/><stop offset=".52" stop-color="#a855f7"/><stop offset=".82" stop-color="#ec4899"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
 <path id="orbit" d="M0 49 C120 5 190 90 320 45 S520 8 640 48 S850 92 980 42 S1110 10 1200 42"/>
</defs>
<rect width="1200" height="92" fill="#080612"/>
<use href="#orbit" fill="none" stroke="url(#nebula)" stroke-width="28" opacity=".34" filter="url(#glow)">
 <animate attributeName="opacity" values=".24;.43;.24" dur="7s" repeatCount="indefinite"/>
</use>
<use href="#orbit" fill="none" stroke="url(#fade)" stroke-width="2.2" opacity=".95"/>
<use href="#orbit" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 34" stroke-linecap="round" opacity=".55">
 <animate attributeName="stroke-dashoffset" from="0" to="-370" dur="18s" repeatCount="indefinite"/>
</use>
<path d="M0 65 C150 28 230 82 370 58 S570 25 710 58 S930 80 1060 50 S1150 34 1200 54" fill="none" stroke="url(#fade)" stroke-width="1" opacity=".55"/>
<g fill="#fff">
 <circle cx="112" cy="26" r="1.4"><animate attributeName="opacity" values=".25;1;.25" dur="3.8s" repeatCount="indefinite"/></circle>
 <circle cx="278" cy="69" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4.6s" repeatCount="indefinite"/></circle>
 <circle cx="468" cy="23" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="688" cy="73" r="1.3"><animate attributeName="opacity" values="1;.25;1" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="904" cy="19" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4.1s" repeatCount="indefinite"/></circle>
 <circle cx="1084" cy="69" r="1.4"><animate attributeName="opacity" values="1;.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
</g>
<circle r="3" fill="#e9fdff" filter="url(#soft)">
 <animateMotion dur="12s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
</circle>
<circle r="1.3" fill="#fff">
 <animateMotion dur="12s" begin="-0.18s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion>
</circle>
</svg>